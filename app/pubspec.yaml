name: knowra
description: "Hawk mobile app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+2

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  audio_session: ^0.2.4
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.4.0
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  cunning_document_scanner: ^3.0.3
  cupertino_icons: ^1.0.8
  equatable: ^2.1.0
  file_picker: ^12.2.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  firebase_storage: ^13.5.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.3.0
  flutter_web_auth_2: ^5.1.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.5.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  in_app_purchase: ^3.3.0
  # Direct rather than transitive, for one field each: the introductory
  # offer. `ProductDetails` is platform-neutral and drops it, and a payment
  # sheet that cannot tell a free trial from an immediate charge must not be
  # shown at all. Pinned to what `in_app_purchase` already resolved.
  in_app_purchase_android: ^0.5.0
  in_app_purchase_storekit: ^0.4.13
  injectable: ^3.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  open_file: ^4.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  razorpay_flutter: ^1.4.7
  sentry_flutter: ^9.0.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.1.0
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  fake_async: ^1.3.3
  # From the SDK, not pub — the pub package predates null safety and will
  # not resolve. Used only by lib/main_qa.dart, the QA driver entrypoint.
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  injectable_generator: ^3.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    - assets/images/
    # Listed separately: a directory entry does not include its
    # subdirectories, so `assets/images/` alone would ship none of these.
    - assets/images/orb_listen/
    - assets/branding/

  # Compiled to SkSL by impellerc at build time, then loaded with
  # `FragmentProgram.fromAsset`. Without this entry the asset does not exist
  # at runtime and the orb silently falls back to its painter.
  shaders:
    - shaders/eye_orb.frag

  fonts:
    # Interface copy and tracked caps labels. Variable font: weight is driven
    # by FontVariation('wght', ...) in AppTypography.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
    # Questions and headlines. Static Regular + Italic.
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    # Metadata — labels, dates, counts, states, percentages, timers.
    # Static weights (Poppins ships no variable font); OFL, see
    # assets/fonts/Poppins-OFL.txt.
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Launcher icons, cut from assets/branding/app_icon.png.
# Regenerate the source art with:
#   flutter test test/tools/generate_app_icons.dart
# then re-cut with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: true
  ios: true
  # iOS rejects icons with an alpha channel; the artwork is opaque anyway.
  remove_alpha_ios: true
  # Android composites its own layers, so the ground is a colour and the
  # foreground is the mark alone with room for the launcher's mask.
  adaptive_icon_background: "#0C0C0D"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  # A layer of its own, not the foreground reused: the launcher tints this one
  # flat, so its highlight has to be a hole rather than the accent.
  adaptive_icon_monochrome: assets/branding/app_icon_monochrome.png

# The OS-drawn splash, shown before Flutter has rendered a frame.
#
# Ground colour only, deliberately. SplashPage's first frame is the same bare
# #0c0c0d, so the handoff is invisible. The mark is tempting here now that v3
# draws it statically — but this image is centred on the screen while the
# Flutter splash centres a *column* (mark, wordmark, tagline), putting the
# mark some 45px higher. The mark would jump the moment Flutter took over.
# Without this block the app flashes white on launch.
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0C0C0D"
  android_12:
    color: "#0C0C0D"
  android: true
  ios: true
  web: false
